stage: 2
stage1: null
targets: [kermany, rsna]
base:
  seed: 42
  batch_size: 32
  epochs: 500
  lr: 0.0001
  autoencoder:
    arch: variational_autoencoder
    hidden_dim_ratio: 0.5
    latent_dim_ratio: 0.25
  alignment:
    align_weight: 0.9
    kl_weight: 0.1
    reconstruction_weight: 0.0
  early_stopping:
    patience: 10
  reduce_lr:
    patience: 5
    factor: 0.1
grid:
  prototype.clustering: [k_means, k_medoids, k_center]
  prototype.undersampling: [null, enn]
  prototype.n_clusters: [1, 2]
