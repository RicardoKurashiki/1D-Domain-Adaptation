seed: 42
batch_size: 64
epochs: 500
lr: 0.0001
autoencoder:
  hidden_dim_ratio: 0.5
  latent_dim_ratio: 0.25
  arch: simple_autoencoder
alignment:
  align_weight: 0.9
  kl_weight: 0.1
  reconstruction_weight: 0.0
early_stopping:
  patience: 20
reduce_lr:
  patience: 5
  factor: 0.1
prototype:
  clustering: k_center
  undersampling: tomek_links
  n_clusters: 1
stage: 2
backbone: resnet50
source_dataset: kermany
target_dataset: rsna
stage1_dir: ./src/experiments/stage1/resnet50/kermany/unfrozen_layers=none
stage1_config: ./src/experiments/stage1/resnet50/kermany/unfrozen_layers=none/config.yaml
