enabled: true

stage: 2
seed: 42
batch_size: 32
epochs: 500
lr: 0.0001
source_dataset: rsna
target_dataset: kermany
stage1_config: src/experiments/stage1/exp_001/config.yaml

prototype:
  n_clusters: 1
  clustering: k_means  # k_means | k_medoids | k_center
  undersampling: null   # null | enn | renn | tomek_links

autoencoder:
  arch: variational_autoencoder  # variational_autoencoder | simple_autoencoder
  hidden_dim_ratio: 0.5
  latent_dim_ratio: 0.25

alignment:
  align_weight: 0.9
  kl_weight: 0.1
  reconstruction_weight: 0.0

early_stopping:
  patience: 10

reduce_lr:
  patience: 5
  factor: 0.1
