seed: 42
batch_size: 32
epochs: 500
lr: 0.0001
model:
  lora:
    r: 8
    alpha: 16
    dropout: 0.1
    target_modules:
    - q_proj
    - v_proj
    bias: none
  backbone: mobilenetv3
  unfrozen_layers: null
early_stopping:
  patience: 20
  start_epoch: 0
reduce_lr:
  patience: 5
  factor: 0.1
data_augmentation:
  enabled: true
  rotation_range: 10
  horizontal_flip: true
  vertical_flip: false
  shear_range: 0.0
  zoom_range:
  - 0.8
  - 1.2
source_dataset: kermany
stage: 1
targets:
- rsna
