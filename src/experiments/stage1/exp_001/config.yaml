enabled: true

stage: 1
seed: 42
batch_size: 32
epochs: 500
lr: 0.0001
source_dataset: rsna  # rsna | kermany

model:
  backbone: resnet18  # resnet18 | resnet50 | vit
  unfrozen_layers: null  # null = frozen | int = last N layers

early_stopping:
  patience: 10
  start_epoch: 0

reduce_lr:
  patience: 5
  factor: 0.1
